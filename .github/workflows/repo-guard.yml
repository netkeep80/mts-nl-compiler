name: repo-guard advisory policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run pinned repo-guard
        id: repo_guard
        uses: netkeep80/repo-guard@10f04af309fcb512dff3d690f595926472c52f40
        with:
          mode: check-pr
          enforcement: advisory
          node-version: 24
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture advisory diagnostics when rules fail
        if: steps.repo_guard.outputs.result != 'passed'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: netkeep80/repo-guard
          ref: 10f04af309fcb512dff3d690f595926472c52f40
          path: .tools/repo-guard
          persist-credentials: false
      - name: Print advisory diagnostics
        if: steps.repo_guard.outputs.result != 'passed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm --prefix .tools/repo-guard install --omit=dev --silent
          node .tools/repo-guard/dist/repo-guard.mjs --repo-root . --enforcement advisory check-pr --format json
      - name: Publish summary
        if: always()
        run: |
          echo "repo-guard result: ${{ steps.repo_guard.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.repo_guard.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
