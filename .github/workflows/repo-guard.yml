name: repo-guard blocking policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run pinned repo-guard v6.0.1
        id: repo_guard
        uses: netkeep80/repo-guard@74db97791e6da8a75287164f0d0b41579108f114
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          node-version: 24

      - name: Capture exact diagnostics
        if: always() && steps.repo_guard.outputs.result != 'passed'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: netkeep80/repo-guard
          ref: 74db97791e6da8a75287164f0d0b41579108f114
          path: .tools/repo-guard-v6
          persist-credentials: false

      - name: Print exact diagnostics
        if: always() && steps.repo_guard.outputs.result != 'passed'
        env:
          RG_BASE: ${{ github.event.pull_request.base.sha }}
          RG_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          npm --prefix .tools/repo-guard-v6 install --omit=dev --silent
          node .tools/repo-guard-v6/dist/repo-guard.mjs --repo-root . check \
            --base "$RG_BASE" \
            --head "$RG_HEAD" \
            --format json || true

      - name: Publish summary
        if: always()
        run: |
          echo "repo-guard result: ${{ steps.repo_guard.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.repo_guard.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
