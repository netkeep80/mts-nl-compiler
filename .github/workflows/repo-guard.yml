name: repo-guard advisory policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run pinned repo-guard
        id: repo_guard
        uses: netkeep80/repo-guard@10f04af309fcb512dff3d690f595926472c52f40
        with:
          mode: check-pr
          enforcement: advisory
          node-version: 24
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish summary
        if: always()
        run: |
          echo "repo-guard result: ${{ steps.repo_guard.outputs.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.repo_guard.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
