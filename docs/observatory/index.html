const bar=(label,value,max,unit,variant)=>'<div class="barline"><span class="barlabel">'+clean(label)+'</span><span class="track"><span class="fill '+(variant||"")+'" style="width:'+Math.min(100,100*value/max).toFixed(2)+'%"></span></span><span class="measure">'+clean(n(value)+unit)+"</span></div>";
const controls=e=>'<div class="stack">'+e.controls.map(c=>'<div><span class="chip '+(/UNKNOWN|WARNING|NEGATIVE|UNIDENTIFIABLE/.test(c.result)?"negative":"green")+'">'+clean(c.result)+'</span> <strong>'+clean(c.name)+'</strong><div class="small muted">'+clean(c.note)+"</div></div>").join("")+"</div>";
const top=(title,intro)=>'<p class="eyebrow">Исследовательская панель / Evidence</p><h1 class="h1">'+clean(title)+'</h1><p class="lede">'+clean(intro)+"</p>";
function overview(){
 const b0=experiments.B0,b1=experiments.B1;
 return top("Наблюдаем результаты, а не только зелёный CI","Снимки реальных выполненных B0/B1 экспериментов. Данные синтетические, источники и версии закреплены; сравнение между разными задачами не является общей метрикой качества.")+
 '<div class="topcards">'+stat("2","Эксперимента","B0 и B1 · Draft")+
 stat("318/318","Тестов успешно","158 + 160, разные ветки")+
 stat("6 + 4","Примеры B0","6 контрастов, 4 heldout")+
 stat("5/5","B1 скрытых форм","Только искусственная грамматика")+"</div>"+
 '<div class="annotation warn"><strong>Не делать неверного вывода:</strong> B0 доказывает отсутствие преимущества от одной бинаризации; B1 показывает структурную комбинаторику при заранее заданных границах документов. Ни один эксперимент не доказывает понимание требований.</div>'+
 '<div class="grid2">'+
 panel("B0 · Предсказание",'<span class="ribbon">P1 · baseline</span><p>'+clean(b0.lead)+'</p>'+bar("top-1",84.92,100,"%","")+
 '<p class="muted small">'+clean(b0.limitation)+'</p><button class="action" type="button" data-view="B0">Открыть фразы и ошибки →</button>')+
 panel("B1 · Продуктивная структура",'<span class="ribbon">P2 · структуры</span><p>'+clean(b1.lead)+'</p>'+bar("recall",100,100,"%","")+
 '<p class="muted small">'+clean(b1.limitation)+'</p><button class="action" type="button" data-view="B1">Открыть Link-матрицу →</button>')+
 '</div>'+panel("Научные ограничения",controls(b0)+"<div class='sep'></div>"+controls(b1))+
 '<p class="small muted">Результаты зафиксированы на конкретных SHA; страница не обращается к GitHub API и не показывает статус CI в реальном времени.</p>';
}
function b0(){
 const e=experiments.B0;
 const rows=e.heldout.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+clean(r.sentence)+'</td><td class="num">'+n(r.bitsPerScalar)+'</td><td class="num">'+percent(r.top1Percent)+'</td><td class="num">'+percent(r.top3Percent)+'</td></tr>').join("");
 const sampleList=e.contrasts.map((x,i)=>'<button class="sample" data-case="'+i+'" type="button" aria-pressed="'+(i===0)+'"><strong>'+clean(x.id)+'</strong> · '+clean(x.kind)+'</button>').join("");
 return top("B0 · Прогноз и диагностика фраз",e.lead)+
 '<div class="topcards">'+stat("330","Исходных наблюдений","Только train")+
 stat("126/126","Scalars coverage","100% train-known")+
 stat("84,92%","Top-1, order 3","Пока синтетика")+
 stat("3,0563","Бит на символ","Order 2 лучше по log-loss")+'</div>'+
 '<div class="grid2">'+
 panel("Log-loss ↓: порядок контекста",'<p class="small muted">Бит на тестовый Unicode-символ. Меньше — лучше.</p>'+e.baselines.map(x=>bar(String(x.order),x.bitsPerScalar,4.7," бит","pale")).join(""))+
 panel("Top-1 ↑: порядок контекста",'<p class="small muted">Доля правильно угаданных следующих символов. Больше — лучше.</p>'+e.baselines.map(x=>bar(String(x.order),x.top1Percent,100,"%","")).join(""))+
 '</div>'+panel("Проверенные фразы · независимые по строкам, но общий корпус синтетический",'<div class="tablewrap"><table><thead><tr><th>#</th><th>Полный текст</th><th>Бит/скаляр</th><th>Top-1</th><th>Top-3</th></tr></thead><tbody>'+rows+"</tbody></table></div>")+
 '<div class="grid2">'+panel("Контрасты · выбор случая",'<input id="case-filter" class="search" type="search" aria-label="Поиск по контрольным фразам" placeholder="Найти фразу или тип ошибки..."><div id="case-list">'+sampleList+"</div>")+
 panel("Разбор конкретного случая",'<div id="case-detail" class="detail"></div>')+'</div>'+
 panel("Негативные проверки",controls(e))+
 '<div class="annotation warn">Разница статистической неожиданности не определяет, правильна ли фраза. T03 и T05 специально демонстрируют корректные, но менее привычные альтернативы.</div>'+srcLinks("B0");
}
function detailB0(idx){
 const item=experiments.B0.contrasts[idx],el=document.getElementById("case-detail");
 if(!item||!el)return;
 el.innerHTML='<div class="kicker">'+clean(item.id)+' · '+clean(item.kind)+'</div><h3>Исходная формулировка</h3><blockquote>'+clean(item.reference)+'</blockquote>'+
 '<h3>Изменённая формулировка</h3><blockquote>'+clean(item.alternative)+'</blockquote>'+
 '<div class="result">'+(item.deltaBitsPerScalar===null?"UNKNOWN / OOV":((item.deltaBitsPerScalar>=0?"+":"")+n(item.deltaBitsPerScalar)+" бит/скаляр"))+'</div>'+
 '<p><span class="chip '+(item.status==="ABSTAIN_OOV"?"negative":"")+'">'+clean(item.status)+'</span></p>'+
 '<p class="small muted">Контроль: '+clean(item.control)+'. Это разность оценок, а не детектор логической или грамматической ошибки.</p>';
 for(const btn of document.querySelectorAll("[data-case]"))btn.setAttribute("aria-pressed",String(Number(btn.dataset.case)===idx));
}
function b1(){
 const e=experiments.B1;
 const h=new Set(e.holdoutCells.map(x=>x.join(":")));
 const matrix='<div class="legend"><span><span class="dot train"></span>Наблюдалось в train</span><span><span class="dot hidden"></span>Скрыто от обучения</span></div>'+
 '<div class="matrix"><table><thead><tr><th>A / B</th>'+e.suffixes.map(x=>"<th>"+clean(x)+"</th>").join("")+'</tr></thead><tbody>'+
 e.roots.map((root,i)=>'<tr><th>'+clean(root)+'</th>'+e.suffixes.map((tail,j)=>{
 const hidden=h.has(i+":"+j);
 return '<td class="'+(hidden?"hidden":"training")+'">'+clean(root+tail)+(hidden?" ★":"")+"</td>";
 }).join("")+"</tr>").join("")+'</tbody></table></div>';
 const examples=e.proposals.map(x=>'<tr><td class="mono">'+clean(x.prefix)+'</td><td class="mono">'+clean(x.suffix)+'</td><td><strong>'+clean(x.surface)+'</strong></td><td class="num">'+n(x.rankNotProbability)+'</td><td class="num">'+n(x.ngramLog2)+'</td></tr>').join("");
 return top("B1 · Как Link предлагает новые сочетания",e.lead)+
 '<div class="topcards">'+stat("19","Обучающих форм","Без внутренних разметок")+
 stat("6 × 4","Части A × B","Разрез после 3 скаляров")+
 stat("5/5","Скрытые комбинации","100% на синтетике")+
 stat("53","Link-узла","18 атомов + 35 пар")+'</div>'+
 panel("Матрица всех сочетаний",'<p class="small muted">Компилятор видел только 19 светлых ячеек. Зелёные пять ячеек были скрыты до теста. Границы отдельных строк были заданы.</p>'+matrix)+
 panel("Пять новых предложений",'<div class="tablewrap"><table><thead><tr><th>Начало</th><th>Конец</th><th>Новый кандидат</th><th>Ранг ≠ P</th><th>n-gram log₂</th></tr></thead><tbody>'+examples+'</tbody></table></div>')+
 '<div class="grid2">'+panel("Структура графа",bar("Атомы",e.linkGraph.atoms,e.linkGraph.total," Link","pale")+bar("Пары",e.linkGraph.pairs,e.linkGraph.total," Link",""))+
 panel("Отрицательные тесты",controls(e))+'</div>'+
 '<div class="annotation warn">Нельзя сравнивать ранг 12–15 с log₂-score n-грамм как вероятности. Перенос в непрерывную речь и смысловая правильность не доказаны.</div>'+srcLinks("B1");
}
function ledgerRows(filter){
 const entries=db.runHistory.filter(x=>filter==="all"||(filter==="FAIL"?x.status==="FAIL":x.kind===filter));
 if(!entries.length)return '<tr><td colspan="6">Записи по выбранному фильтру отсутствуют.</td></tr>';
 return [...entries].reverse().map(x=>'<tr><td><span class="chip '+(x.status==="FAIL"?"negative":"green")+'">'+clean(x.status)+'</span></td>'+
  '<td>'+clean(x.experiment)+'</td><td>'+clean(x.kind)+'</td>'+
  '<td>'+clean(x.observedAt.replace("T"," ").replace("Z"," UTC"))+'</td>'+
  '<td>'+url(x.evidence,"#"+x.runId)+(x.testsTotal===null?"":'<div class="small muted">'+x.testsPassed+"/"+x.testsTotal+" тестов</div>")+'</td>'+
  '<td>'+clean(x.note)+'</td></tr>').join("");
}
function ledgerPanel(){
 const nFail=db.runHistory.filter(x=>x.status==="FAIL").length;
 return panel("Реальные запуски CI и repo-guard",
 '<p class="small muted">'+clean(db.historyDisclosure)+'</p>'+
 '<div class="links">'+
 '<button type="button" class="action" data-runfilter="all" aria-pressed="true">Все ('+db.runHistory.length+')</button>'+
 '<button type="button" class="action" data-runfilter="CI" aria-pressed="false">Node CI</button>'+
 '<button type="button" class="action" data-runfilter="GUARD" aria-pressed="false">Repo-guard</button>'+
 '<button type="button" class="action" data-runfilter="FAIL" aria-pressed="false">Отказы ('+nFail+')</button>'+
 '</div>'+
 '<div class="tablewrap"><table><thead><tr><th>Статус</th><th>Эксп.</th><th>Тип</th><th>Время</th><th>Доказательство</th><th>Причина / результат</th></tr></thead>'+
 '<tbody id="runhistory-rows">'+ledgerRows("all")+'</tbody></table></div>');
}
function history(){
 return top("История экспериментов и доказательства","История научных этапов с точными ссылками на исходный код, контрольные SHA и результаты проверок. Это зафиксированный снимок, не онлайн-мониторинг.")+
 ledgerPanel()+
 db.experiments.map(e=>'<section class="time"><div><div class="kicker">'+clean(e.date)+' · '+clean(e.stage)+'</div><h3>'+clean(e.id+" — "+e.title)+'</h3><p>'+clean(e.lead)+'</p><div class="links">'+url(source[e.id].report,"Подробный отчёт")+url(source[e.id].ci,"Тесты CI")+url(source[e.id].guard,"Repo-guard")+'</div>'+
 '<div class="small"><span class="ribbon grey">Draft / не принято</span> · '+e.testsPassed+'/'+e.testsTotal+' tests PASS</div>'+
 '<p class="mono small">Head: '+clean(source[e.id].head)+'</p><p class="mono small">Fixture SHA256: '+clean(source[e.id].fixtureSha256)+'</p></div></section>').join("")+
 panel("Модель обновления",'<p>Добавление эксперимента производится через <code>data/observatory/runs-v1.json</code>. Генератор формирует полностью автономный <code>docs/observatory/index.html</code>; тесты сравнивают его байт-в-байт с исходными данными.</p>'+
 '<p>Данные являются вручную закреплёнными проверенными снимками исходных отчётов. Автоматический импорт из CI и публичный GitHub Pages пока не включены.</p>')+
 '<div class="annotation warn">Следующий обязательный научный шаг — независимый набор реальных требований и честная проверка B2 на непрерывном потоке; красивые графики не заменяют доказательства.</div>';
}
function navigate(view){
 if(!["overview","B0","B1","history"].includes(view))view="overview";
 for(const b of document.querySelectorAll(".navbtn"))b.setAttribute("aria-current",b.dataset.view===view?"page":"false");
 target.innerHTML=view==="B0"?b0():view==="B1"?b1():view==="history"?history():overview();
 if(view==="B0")detailB0(0);
 document.title="MTS NL — "+({overview:"Обзор",B0:"Предсказания",B1:"Структура",history:"История"}[view]);
 if(location.hash!=="#"+view)window.history.replaceState(null,"","#"+view);
}
document.addEventListener("click",e=>{
 const button=e.target.closest("button");
 if(!button)return;
 if(button.dataset.view)navigate(button.dataset.view);
 if(button.dataset.runfilter){
  const filter=button.dataset.runfilter,tbody=document.getElementById("runhistory-rows");
  if(tbody)tbody.innerHTML=ledgerRows(filter);
  for(const b of document.querySelectorAll("[data-runfilter]"))
   b.setAttribute("aria-pressed",String(b.dataset.runfilter===filter));
 }
 if(button.dataset.case!==undefined)detailB0(Number(button.dataset.case));
});
document.addEventListener("input",e=>{
 if(e.target.id!=="case-filter")return;
 const needle=e.target.value.toLocaleLowerCase("ru");
 for(const el of document.querySelectorAll(".sample")){
  const c=experiments.B0.contrasts[Number(el.dataset.case)];
  el.hidden=!([c.reference,c.alternative,c.kind,c.id].join(" ").toLocaleLowerCase("ru").includes(needle));
 }
});
window.addEventListener("hashchange",()=>navigate(location.hash.slice(1)));
navigate(location.hash.slice(1));
})();
</script>
</body>
</html>
