id: MNC-024
status: RESEARCH_UNACCEPTED
normative_language: ru
requirement: >
  Экспорт асети в JSON допускает только строки, объекты и null.
  null является исключительно терминатором выбранной последовательности
  в транспортном JSON и не переопределяет bare-entry канонического
  FORMAL JSON МТС v0.15. Пустая ExactSequence имеет денотацию R;
  сама R может встречаться значением позиции. Переход между транспортом
  и семантическими ячейками допускается только как явно проверенный адаптер.
compatibility_gate: FULL_SOURCE_ANET_INTERCHANGE_NOT_PROVED
