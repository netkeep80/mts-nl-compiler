id: MNC-026
status: RESEARCH_UNACCEPTED
normative_language: ru
requirement: >
  Каждая связь исходной асети должна сохранять индивидуальную идентичность
  при экспорте и импорте JSON, включая параллельные связи с одинаковыми
  полюсами, повторные вхождения и циклы. Строковые значения сохраняются
  побайтово в UTF-8; null допускается только как терминатор выбранной
  последовательности транспортного JSON, а не как идентификатор Link.
  Исследовательское представление исходного графа в native МТС допустимо
  через явно проверенные связанные структуры; их идентичности не становятся
  без отдельного доказательства каноническими семантическими Links МТС.
native_registry_transport: TESTED_ON_PINNED_UPSTREAM
