format: repo-guard/requirement-v1
id: MNC-CORPUS-001
normative: "### MNC-CORPUS-001 — Reproducible pinned corpus and measured import\n\n**MUST:** corpus experiments use explicit source/provenance manifests, deterministic import and reporting, exact replay and fail-closed validation. Large-corpus and real-corpus workflows must keep source identity, observed structural counts and physical storage metrics distinct from probability or semantic claims; original source texts are not silently republished as generated artifacts."
