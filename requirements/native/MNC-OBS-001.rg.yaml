format: repo-guard/requirement-v1
id: MNC-OBS-001
normative: "### MNC-OBS-001 — Deterministic research observability and browser compiler\n\n**MUST:** accepted browser-facing research surfaces remain offline/static, deterministic, safe for arbitrary Unicode input, reproducible from pinned evidence, and explicit about the difference between structural Link metrics and scientific or semantic acceptance. Generated Observatory HTML must be reproducible from its builder, template and pinned run data."
