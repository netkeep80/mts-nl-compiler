format: repo-guard/requirement-v1
id: MNC-REPO-001
normative: "### MNC-REPO-001 — Reproducible repository execution boundary\n\n**MUST:** the accepted repository remains a self-describing Node.js project with an explicit license, package entry point, transient-file exclusions, project-memory root, and CI execution of the repository test suite. These repository mechanics support reproducibility and governance only; CI success MUST NOT be presented as scientific or semantic acceptance."
lifecycle:
  accepted: true
  current: true
  published: false
