format: repo-guard/requirement-v1
id: MNC-REPO-001
normative: "### MNC-REPO-001 — Reproducible repository execution boundary\n\n**MUST:** the accepted repository remains a self-describing private ESM Node.js 24+ project with an explicit npm test entry, CI execution of the repository test suite, a project-memory locator, and Git exclusions for transient dependency, coverage, build and local database artifacts. These repository mechanics support reproducibility and governance only; CI success MUST NOT be presented as scientific or semantic acceptance. No package runtime export or library entry-point contract is asserted by this Requirement."
lifecycle:
  accepted: true
  current: true
  published: false
relations:
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: ".github/workflows/ci.yml"
  - predicates: [requires]
    target:
      kind: artifact
      path: ".anet/memory.json"
  - predicates: [implemented_by]
    target:
      kind: artifact
      path: ".gitignore"
  - predicates: [requires]
    target:
      kind: artifact
      path: "package.json"
