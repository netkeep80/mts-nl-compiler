format: repo-guard/requirement-v1
id: MNC-STORAGE-001
normative: "### MNC-STORAGE-001 — Canonical numeric Link storage and exact replay\n\n**MUST:** the accepted canonical storage layer uses the SQLite links relation with integer physical Link identity and indexed poles, preserves exact 64-bit graph/text replay, and supports deterministic numeric allocation and legacy migration without changing accepted MTS semantics. Hashes may evidence artifact integrity but MUST NOT define physical Link identity. Numeric storage tests must exercise schema invariants, parallel identities, cycles, weights and migration behavior."
