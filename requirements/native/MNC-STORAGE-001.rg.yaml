format: repo-guard/requirement-v1
id: MNC-STORAGE-001
normative: "### MNC-STORAGE-001 — Canonical numeric Link storage and exact replay\n\n**MUST:** the accepted storage layer uses canonical SQLite integer Link identity with indexed poles and preserves exact graph/text replay across the numeric cutover and legacy bridge. Hashes may evidence artifact integrity but MUST NOT define physical Link identity. Storage tests must exercise schema, DAG replay, packed representation, numeric allocation and legacy migration without silently changing accepted MTS semantics."
