<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="Наблюдение за научными тестами mts-nl-compiler: проверки, отрицательные результаты, предсказания Link и контрольные n-граммы.">
<title>MTS NL Compiler — Observatory</title>
<style>
:root{font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1b2b34;background:#edf2f4;--ink:#182c38;--muted:#617582;--accent:#087e78;--line:#dae4e8;--bg:#fff;--soft:#f5f9fa;--danger:#ac4a35}
*{box-sizing:border-box}body{margin:0}a{color:#126d84;text-decoration:none}a:hover{text-decoration:underline}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #3b9bab;outline-offset:3px}
.shell{max-width:1480px;margin:auto;padding:26px 28px 56px}.mast{display:flex;align-items:center;gap:18px;margin-bottom:20px}.logo{width:45px;height:45px;display:grid;place-items:center;background:#173743;color:#d8f8eb;border-radius:13px;font-weight:800;letter-spacing:-2px;font-size:23px}.brand{font-weight:760;font-size:15px;letter-spacing:.05em}.brand-sub{font-size:12px;color:var(--muted)}.stamp{margin-left:auto;color:var(--muted);font-size:12px}
.columns{display:grid;grid-template-columns:206px minmax(0,1fr);gap:22px}.sidebar{padding:6px 10px 0 0;border-right:1px solid var(--line)}.navlabel{font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.12em;color:#78919d;margin:12px 10px}.navbtn{display:block;width:100%;text-align:left;padding:12px 13px;border:0;border-radius:10px;background:transparent;color:#405967;font-weight:600;margin:4px 0}.navbtn[aria-current="page"]{background:#d5eae6;color:#0c655f}.meta-box{border-top:1px solid var(--line);margin:20px 10px;padding:15px 0;color:var(--muted);font-size:12px}.content{min-width:0}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}.h1{font-size:clamp(29px,4vw,44px);line-height:1.1;letter-spacing:-.04em;margin:0 0 12px;color:var(--ink)}.lede{margin:0 0 22px;color:#526a78;max-width:790px;font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.annotation{margin:18px 0;padding:14px 18px;background:#eef7f4;border-left:4px solid #368c7f;border-radius:7px;color:#25534b}.annotation.warn{background:#fff5ec;border-color:#cb8a5c;color:#80512e}.topcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}.stat,.panel{background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 4px rgba(20,47,55,.025)}.stat{padding:18px}.stat .num{font-size:28px;font-weight:780;letter-spacing:-.05em;line-height:1.2}.stat .name{font-size:12px;color:var(--muted);margin-top:5px}.stat .detail{font-size:11px;color:#8195a1;margin-top:6px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{padding:20px;margin:0 0 16px;min-width:0}.panel h2{font-size:19px;letter-spacing:-.02em;margin:0 0 12px}.panel h3{font-size:15px;margin:16px 0 8px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:800}.ribbon{font-size:11px;display:inline-block;border:1px solid #cadfdc;border-radius:5px;background:#e9f5f1;color:#236f64;padding:2px 8px;font-weight:750}.ribbon.grey{background:#edf1f3;border-color:#e0e6e8;color:#577079}.ribbon.warn{background:#fff2e6;border-color:#f2d4b4;color:#87552a}
.stack{display:grid;gap:11px}.exp-card{border:1px solid var(--line);padding:17px;border-radius:12px;background:#fff}.exp-card h3{margin:5px 0}.exp-card p{margin:4px 0;color:var(--muted)}.action{border:1px solid #9bbeb9;color:#23695f;background:transparent;padding:7px 11px;border-radius:8px;font-weight:700;margin-top:10px}.action:hover{background:#e9f6f1}
.barline{display:grid;grid-template-columns:42px minmax(0,1fr) 90px;align-items:center;gap:12px;margin:12px 0}.track{height:13px;background:#e9f0f1;border-radius:7px;overflow:hidden}.fill{display:block;height:100%;border-radius:7px;background:var(--accent)}.fill.pale{background:#6798c0}.measure{font-variant-numeric:tabular-nums;text-align:right;font-size:12px;font-weight:750}.barlabel{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;margin-top:12px;border:1px solid #e4ebee;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e9eef1;vertical-align:top}th{background:#f4f7f8;color:#4b606d;white-space:nowrap;font-size:11px;letter-spacing:.02em}tr:last-child td{border-bottom:0}tbody tr:hover{background:#f6faf9}td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.chip{display:inline-block;padding:2px 8px;background:#edf4f6;border-radius:8px;font-size:11px;color:#4a6b77;white-space:nowrap}.chip.negative{background:#fff0e9;color:#9a5131}.chip.green{background:#e6f5eb;color:#2d7547}
.search{width:100%;padding:10px 13px;border:1px solid #bfd2d9;border-radius:9px;background:#fff;margin-bottom:12px}.sample{display:block;width:100%;border:1px solid var(--line);background:#fff;padding:12px;border-radius:9px;text-align:left;margin-bottom:8px;color:var(--ink)}.sample[aria-pressed="true"]{border-color:#318c7d;background:#ecf7f3}.sample[hidden]{display:none}.detail{background:var(--soft);border:1px solid #e0eaed;border-radius:10px;padding:17px;word-break:break-word}.detail blockquote{margin:9px 0;padding:12px 14px;background:#fff;border-left:3px solid #bddbd4}.detail .result{font-weight:750;font-size:21px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 12px}.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}.dot.train{background:#cadfe1}.dot.hidden{background:#64a799}
.matrix{overflow-x:auto}.matrix table{min-width:630px}.matrix td{font-family:ui-monospace,Consolas,monospace;font-size:12px;text-align:center}.matrix td.training{background:#eff6f7;color:#3b6670}.matrix td.hidden{background:#d8f2e9;color:#126557;font-weight:800}.matrix th{text-align:center}
.time{display:flex;gap:16px;border-left:3px solid #c4dce1;padding:0 0 25px 20px;margin-left:8px;position:relative}.time:before{content:"";width:13px;height:13px;border-radius:50%;border:3px solid var(--accent);background:#fff;position:absolute;top:2px;left:-8px}.time>div{flex:1}.time h3{margin:0 0 6px}.time p{margin:0 0 8px;color:var(--muted)}
.footer{margin:26px 0;font-size:12px;color:var(--muted)}.sep{border-top:1px solid var(--line);margin:24px 0}.links{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
@media(max-width:950px){.columns{grid-template-columns:1fr}.sidebar{display:flex;flex-wrap:wrap;border:0;padding:0}.navlabel,.meta-box{display:none}.navbtn{width:auto}.topcards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:570px){.shell{padding:16px}.stamp{display:none}.topcards{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:12px}.stat .num{font-size:23px}.panel{padding:15px}.barline{grid-template-columns:30px minmax(0,1fr) 65px;gap:6px}.h1{font-size:29px}}
</style>
</head>
<body>
<div class="shell">
<header class="mast"><div class="logo" aria-hidden="true">⟼</div><div><div class="brand">MTS NL COMPILER</div><div class="brand-sub">Research Observatory · Link experiments</div></div><span class="stamp" id="asof"></span></header>
<div class="columns">
<aside class="sidebar" aria-label="Разделы панели">
<div class="navlabel">Навигация</div>
<button type="button" class="navbtn" data-view="overview">Обзор</button>
<button type="button" class="navbtn" data-view="B0">B0 · Предсказания</button>
<button type="button" class="navbtn" data-view="B1">B1 · Структура</button>
<button type="button" class="navbtn" data-view="W22">W22 · 60 книг</button>
<button type="button" class="navbtn" data-view="history">История и источники</button>
<a class="navbtn" href="../compiler/" aria-label="Открыть интерактивный Link компилятор">↗ Веб-компилятор</a>
<div class="meta-box">Исследовательские Draft PR.<br>Данные закреплены за SHA.<br>Страница не выполняет обучение.</div>
</aside>
<main class="content" id="content" tabindex="-1" aria-live="polite"></main>
</div>
<footer class="footer">Локальный, автономный snapshot · Нет внешних скриптов и запросов · Не является заявлением о семантическом понимании.</footer>
</div>
<script id="observatory-data" type="application/json">__OBSERVATORY_DATA__</script>
<script>
(function(){
"use strict";
const db=JSON.parse(document.getElementById("observatory-data").textContent);
const experiments=Object.fromEntries(db.experiments.map(x=>[x.id,x]));
const source=Object.fromEntries(db.sources.map(x=>[x.id,x]));
const target=document.getElementById("content");
document.getElementById("asof").textContent="Снимок: "+db.asOf+" · Git SHA pinned";
const clean=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n=x=>Number(x).toLocaleString("ru-RU",{maximumFractionDigits:4});
const percent=x=>Number(x).toFixed(2)+"%";
const url=(x,label)=>'<a href="'+clean(x)+'" target="_blank" rel="noopener noreferrer">'+clean(label)+" ↗</a>";
const srcLinks=id=>'<div class="links">'+url(source[id].report,"Исходный отчёт")+url(source[id].ci,"CI tests")+url(source[id].guard,"repo-guard")+url("https://github.com/netkeep80/mts-nl-compiler/pull/"+source[id].pr,"Draft PR #"+source[id].pr)+"</div>";
const panel=(title,body)=>'<section class="panel"><h2>'+clean(title)+"</h2>"+body+"</section>";
const stat=(v,t,sub)=>'<div class="stat"><div class="num">'+clean(v)+'</div><div class="name">'+clean(t)+'</div><div class="detail">'+clean(sub||"")+"</div></div>";
const bar=(label,value,max,unit,variant)=>'<div class="barline"><span class="barlabel">'+clean(label)+'</span><span class="track"><span class="fill '+(variant||"")+'" style="width:'+Math.min(100,100*value/max).toFixed(2)+'%"></span></span><span class="measure">'+clean(n(value)+unit)+"</span></div>";
const controls=e=>'<div class="stack">'+e.controls.map(c=>'<div><span class="chip '+(/UNKNOWN|WARNING|NEGATIVE|UNIDENTIFIABLE/.test(c.result)?"negative":"green")+'">'+clean(c.result)+'</span> <strong>'+clean(c.name)+'</strong><div class="small muted">'+clean(c.note)+"</div></div>").join("")+"</div>";
const top=(title,intro)=>'<p class="eyebrow">Исследовательская панель / Evidence</p><h1 class="h1">'+clean(title)+'</h1><p class="lede">'+clean(intro)+"</p>";
function overview(){
 const b0=experiments.B0,b1=experiments.B1;
 return top("Наблюдаем результаты, а не только зелёный CI","Два синтетических эксперимента B0/B1 и отдельно подтверждённый пилот W22-D0 на реальных 60 книгах. Разные задачи и разные объёмы входа никогда не объединяются в одну метрику.")+
 '<div class="topcards">'+stat("2","Эксперимента","B0 и B1 · Draft")+
 stat("318/318","Тестов успешно","158 + 160, разные ветки")+
 stat("6 + 4","Примеры B0","6 контрастов, 4 heldout")+
 stat("5/5","B1 скрытых форм","Только искусственная грамматика")+"</div>"+
 '<div class="annotation warn"><strong>Не делать неверного вывода:</strong> B0 доказывает отсутствие преимущества от одной бинаризации; B1 показывает структурную комбинаторику при заранее заданных границах документов. Ни один эксперимент не доказывает понимание требований.</div>'+
 '<div class="grid2">'+
 panel("B0 · Предсказание",'<span class="ribbon">P1 · baseline</span><p>'+clean(b0.lead)+'</p>'+bar("top-1",84.92,100,"%","")+
 '<p class="muted small">'+clean(b0.limitation)+'</p><button class="action" type="button" data-view="B0">Открыть фразы и ошибки →</button>')+
 panel("B1 · Продуктивная структура",'<span class="ribbon">P2 · структуры</span><p>'+clean(b1.lead)+'</p>'+bar("recall",100,100,"%","")+
 '<p class="muted small">'+clean(b1.limitation)+'</p><button class="action" type="button" data-view="B1">Открыть Link-матрицу →</button>')+
 '</div>'+panel("W22-D0 · настоящий корпус 60 книг",'<span class="ribbon grey">Проверено на pinned RusLit</span><p><strong>Окно 6: −1 Link, окно 8: 0 Link</strong> на одинаковых фрагментах 12 heldout книг. Физического сокращения SQLite в байтах нет. Это не показатель экономии на всех 60 книгах.</p><button type="button" class="action" data-view="W22">Открыть результаты 60 книг →</button>')+
 panel("Научные ограничения",controls(b0)+"<div class='sep'></div>"+controls(b1))+
 '<p class="small muted">Результаты зафиксированы на конкретных SHA; страница не обращается к GitHub API и не показывает статус CI в реальном времени.</p>';
}
function b0(){
 const e=experiments.B0;
 const rows=e.heldout.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+clean(r.sentence)+'</td><td class="num">'+n(r.bitsPerScalar)+'</td><td class="num">'+percent(r.top1Percent)+'</td><td class="num">'+percent(r.top3Percent)+'</td></tr>').join("");
 const sampleList=e.contrasts.map((x,i)=>'<button class="sample" data-case="'+i+'" type="button" aria-pressed="'+(i===0)+'"><strong>'+clean(x.id)+'</strong> · '+clean(x.kind)+'</button>').join("");
 return top("B0 · Прогноз и диагностика фраз",e.lead)+
 '<div class="topcards">'+stat("330","Исходных наблюдений","Только train")+
 stat("126/126","Scalars coverage","100% train-known")+
 stat("84,92%","Top-1, order 3","Пока синтетика")+
 stat("3,0563","Бит на символ","Order 2 лучше по log-loss")+'</div>'+
 '<div class="grid2">'+
 panel("Log-loss ↓: порядок контекста",'<p class="small muted">Бит на тестовый Unicode-символ. Меньше — лучше.</p>'+e.baselines.map(x=>bar(String(x.order),x.bitsPerScalar,4.7," бит","pale")).join(""))+
 panel("Top-1 ↑: порядок контекста",'<p class="small muted">Доля правильно угаданных следующих символов. Больше — лучше.</p>'+e.baselines.map(x=>bar(String(x.order),x.top1Percent,100,"%","")).join(""))+
 '</div>'+panel("Проверенные фразы · независимые по строкам, но общий корпус синтетический",'<div class="tablewrap"><table><thead><tr><th>#</th><th>Полный текст</th><th>Бит/скаляр</th><th>Top-1</th><th>Top-3</th></tr></thead><tbody>'+rows+"</tbody></table></div>")+
 '<div class="grid2">'+panel("Контрасты · выбор случая",'<input id="case-filter" class="search" type="search" aria-label="Поиск по контрольным фразам" placeholder="Найти фразу или тип ошибки..."><div id="case-list">'+sampleList+"</div>")+
 panel("Разбор конкретного случая",'<div id="case-detail" class="detail"></div>')+'</div>'+
 panel("Негативные проверки",controls(e))+
 '<div class="annotation warn">Разница статистической неожиданности не определяет, правильна ли фраза. T03 и T05 специально демонстрируют корректные, но менее привычные альтернативы.</div>'+srcLinks("B0");
}
function detailB0(idx){
 const item=experiments.B0.contrasts[idx],el=document.getElementById("case-detail");
 if(!item||!el)return;
 el.innerHTML='<div class="kicker">'+clean(item.id)+' · '+clean(item.kind)+'</div><h3>Исходная формулировка</h3><blockquote>'+clean(item.reference)+'</blockquote>'+
 '<h3>Изменённая формулировка</h3><blockquote>'+clean(item.alternative)+'</blockquote>'+
 '<div class="result">'+(item.deltaBitsPerScalar===null?"UNKNOWN / OOV":((item.deltaBitsPerScalar>=0?"+":"")+n(item.deltaBitsPerScalar)+" бит/скаляр"))+'</div>'+
 '<p><span class="chip '+(item.status==="ABSTAIN_OOV"?"negative":"")+'">'+clean(item.status)+'</span></p>'+
 '<p class="small muted">Контроль: '+clean(item.control)+'. Это разность оценок, а не детектор логической или грамматической ошибки.</p>';
 for(const btn of document.querySelectorAll("[data-case]"))btn.setAttribute("aria-pressed",String(Number(btn.dataset.case)===idx));
}
function b1(){
 const e=experiments.B1;
 const h=new Set(e.holdoutCells.map(x=>x.join(":")));
 const matrix='<div class="legend"><span><span class="dot train"></span>Наблюдалось в train</span><span><span class="dot hidden"></span>Скрыто от обучения</span></div>'+
 '<div class="matrix"><table><thead><tr><th>A / B</th>'+e.suffixes.map(x=>"<th>"+clean(x)+"</th>").join("")+'</tr></thead><tbody>'+
 e.roots.map((root,i)=>'<tr><th>'+clean(root)+'</th>'+e.suffixes.map((tail,j)=>{
 const hidden=h.has(i+":"+j);
 return '<td class="'+(hidden?"hidden":"training")+'">'+clean(root+tail)+(hidden?" ★":"")+"</td>";
 }).join("")+"</tr>").join("")+'</tbody></table></div>';
 const examples=e.proposals.map(x=>'<tr><td class="mono">'+clean(x.prefix)+'</td><td class="mono">'+clean(x.suffix)+'</td><td><strong>'+clean(x.surface)+'</strong></td><td class="num">'+n(x.rankNotProbability)+'</td><td class="num">'+n(x.ngramLog2)+'</td></tr>').join("");
 return top("B1 · Как Link предлагает новые сочетания",e.lead)+
 '<div class="topcards">'+stat("19","Обучающих форм","Без внутренних разметок")+
 stat("6 × 4","Части A × B","Разрез после 3 скаляров")+
 stat("5/5","Скрытые комбинации","100% на синтетике")+
 stat("53","Link-узла","18 атомов + 35 пар")+'</div>'+
 panel("Матрица всех сочетаний",'<p class="small muted">Компилятор видел только 19 светлых ячеек. Зелёные пять ячеек были скрыты до теста. Границы отдельных строк были заданы.</p>'+matrix)+
 panel("Пять новых предложений",'<div class="tablewrap"><table><thead><tr><th>Начало</th><th>Конец</th><th>Новый кандидат</th><th>Ранг ≠ P</th><th>n-gram log₂</th></tr></thead><tbody>'+examples+'</tbody></table></div>')+
 '<div class="grid2">'+panel("Структура графа",bar("Атомы",e.linkGraph.atoms,e.linkGraph.total," Link","pale")+bar("Пары",e.linkGraph.pairs,e.linkGraph.total," Link",""))+
 panel("Отрицательные тесты",controls(e))+'</div>'+
 '<div class="annotation warn">Нельзя сравнивать ранг 12–15 с log₂-score n-грамм как вероятности. Перенос в непрерывную речь и смысловая правильность не доказаны.</div>'+srcLinks("B1");
}
function w22(){
 const e=db.w22d0;
 const report='<div class="links">'+url(e.reportUrl,"Научный отчёт W22-D0")+
  url(e.ciUrl,"Полная CI-сборка 60 книг")+
  url("https://github.com/netkeep80/mts-nl-compiler/issues/104","Issue #104")+'</div>';
 const rows=e.windows.map(x=>'<tr><td>'+x.width+'</td><td class="num">'+n(x.candidates)+'</td>'+
  '<td class="num">'+x.selectedOrdinal+'</td><td class="num">'+n(x.baselinePhysicalLinksSummed)+'</td>'+
  '<td class="num">'+n(x.selectedPhysicalLinksSummed)+'</td>'+
  '<td class="num"><strong>'+n(x.deltaPhysicalLinks)+'</strong></td>'+
  '<td>'+x.improvedDocs+' / '+x.regressedDocs+' / '+x.tiedDocs+'</td>'+
  '<td class="num">'+n(x.deltaSqliteVacuumBytes)+'</td>'+
  '<td class="num">'+n(x.trainingTimeMsObserved)+' мс</td></tr>').join("");
 const table='<div class="tablewrap"><table><thead><tr><th>Ширина</th><th>Деревьев</th>'+
  '<th>Выбранный ordinal</th><th>Balanced Link</th><th>Выбранный Link</th>'+
  '<th>Δ Link</th><th>Лучше / хуже / равно</th><th>Δ SQLite байт</th><th>Поиск формы</th>'+
  '</tr></thead><tbody>'+rows+'</tbody></table></div>';
 const f=e.fullCorpusReferenceOnly;
 return top("W22-D0 · 60 настоящих книг","Результат независимого пилота с точным исходным Git-коммитом: не успех любой ценой, а измеренная почти нулевая выгода группировки.")+
 '<div class="topcards">'+stat("60","Книг","19 701 816 исходных байт")+
 stat("48 / 12","Train / heldout","Выбор формы на 4 train")+
 stat("−1 / 0","Δ Link","Окно 6 / окно 8")+
 stat("0 байт","Δ VACUUM","Для обоих размеров окна")+'</div>'+
 '<div class="annotation warn"><strong>Что именно измерено:</strong> 12 отдельных опытов. Каждый содержит два 32-скалярных фрагмента: отложенная книга и фиксированный учебный контекст. Количество Link в таблице — <strong>сумма по 12 независимо построенным SQLite-базам</strong>, а не число Link во всей базе 60 книг.</div>'+
 panel("Контроль на отложенных книгах",table+
  '<p class="small muted">Δ = Link выбранного дерева − Link balanced, отрицательное — экономия. Замена бинарной формы зафиксирована до просмотра 12 heldout. Время — одно наблюдение Linux Node24, не переносимый benchmark.</p>')+
 panel("Полнокорпусные ориентиры — другая задача",
  '<p class="small muted">Оригинальная сборка всех 60 книг, показана для масштаба отдельно: эти значения нельзя сравнивать напрямую с маленькими 32-скалярными опытами.</p>'+
  '<div class="tablewrap"><table><thead><tr><th>Отдельная модель</th><th>Физических Link</th><th>SQLite VACUUM</th></tr></thead><tbody>'+
  '<tr><td>Balanced, все 60 книг</td><td class="num">'+n(f.balancedLinks)+'</td><td class="num">'+n(f.balancedSqliteVacuumBytes)+' байт</td></tr>'+
  '<tr><td>W4 Re-Pair, все 60 книг</td><td class="num">'+n(f.w4Links)+'</td><td class="num">'+n(f.w4SqliteVacuumBytes)+' байт</td></tr></tbody></table></div>')+
 panel("Доказательства и ограничения",
  '<p>Исходный корпус: <strong>'+clean(e.sourceRepo)+'</strong>, SHA '+clean(e.sourceCommit)+
  '. Отчёт содержит 12 независимых проверочных книг, полный холодный replay и физические Link ID SQLite, а не hash IDs.</p>'+report+
  '<div class="stack">'+e.limitations.map(x=>'<div class="small muted">• '+clean(x)+'</div>').join("")+'</div>')+
 '<div class="annotation">Вывод: перебор 429 разложений формы окна сам по себе не дал измеримой экономии Link на heldout. Следующий эксперимент должен учитывать фактически существующий общий словарь Link, историю и предельную стоимость вставки.</div>';
}
function ledgerRows(filter){
 const entries=db.runHistory.filter(x=>filter==="all"||(filter==="FAIL"?x.status==="FAIL":x.kind===filter));
 if(!entries.length)return '<tr><td colspan="6">Записи по выбранному фильтру отсутствуют.</td></tr>';
 return [...entries].reverse().map(x=>'<tr><td><span class="chip '+(x.status==="FAIL"?"negative":"green")+'">'+clean(x.status)+'</span></td>'+
  '<td>'+clean(x.experiment)+'</td><td>'+clean(x.kind)+'</td>'+
  '<td>'+clean(x.observedAt.replace("T"," ").replace("Z"," UTC"))+'</td>'+
  '<td>'+url(x.evidence,"#"+x.runId)+(x.testsTotal===null?"":'<div class="small muted">'+x.testsPassed+"/"+x.testsTotal+" тестов</div>")+'</td>'+
  '<td>'+clean(x.note)+'</td></tr>').join("");
}
function ledgerPanel(){
 const nFail=db.runHistory.filter(x=>x.status==="FAIL").length;
 return panel("Реальные запуски CI и repo-guard",
 '<p class="small muted">'+clean(db.historyDisclosure)+'</p>'+
 '<div class="links">'+
 '<button type="button" class="action" data-runfilter="all" aria-pressed="true">Все ('+db.runHistory.length+')</button>'+
 '<button type="button" class="action" data-runfilter="CI" aria-pressed="false">Node CI</button>'+
 '<button type="button" class="action" data-runfilter="GUARD" aria-pressed="false">Repo-guard</button>'+
 '<button type="button" class="action" data-runfilter="FAIL" aria-pressed="false">Отказы ('+nFail+')</button>'+
 '</div>'+
 '<div class="tablewrap"><table><thead><tr><th>Статус</th><th>Эксп.</th><th>Тип</th><th>Время</th><th>Доказательство</th><th>Причина / результат</th></tr></thead>'+
 '<tbody id="runhistory-rows">'+ledgerRows("all")+'</tbody></table></div>');
}
function history(){
 return top("История экспериментов и доказательства","История научных этапов с точными ссылками на исходный код, контрольные SHA и результаты проверок. Это зафиксированный снимок, не онлайн-мониторинг.")+
 ledgerPanel()+
 db.experiments.map(e=>'<section class="time"><div><div class="kicker">'+clean(e.date)+' · '+clean(e.stage)+'</div><h3>'+clean(e.id+" — "+e.title)+'</h3><p>'+clean(e.lead)+'</p><div class="links">'+url(source[e.id].report,"Подробный отчёт")+url(source[e.id].ci,"Тесты CI")+url(source[e.id].guard,"Repo-guard")+'</div>'+
 '<div class="small"><span class="ribbon grey">Draft / не принято</span> · '+e.testsPassed+'/'+e.testsTotal+' tests PASS</div>'+
 '<p class="mono small">Head: '+clean(source[e.id].head)+'</p><p class="mono small">Fixture SHA256: '+clean(source[e.id].fixtureSha256)+'</p></div></section>').join("")+
 panel("Модель обновления",'<p>Добавление эксперимента производится через <code>data/observatory/runs-v1.json</code>. Генератор формирует полностью автономный <code>docs/observatory/index.html</code>; тесты сравнивают его байт-в-байт с исходными данными.</p>'+
 '<p>Данные являются вручную закреплёнными проверенными снимками исходных отчётов. GitHub Pages опубликован из main/docs; автоматический импорт новых результатов CI пока не включён.</p>')+
 '<div class="annotation warn">Следующая научная задача — явная предельная стоимость Link в существующей асети и независимые тексты требований. Красивые графики не заменяют точного холодного replay и честного heldout.</div>';
}
function navigate(view){
 if(!["overview","B0","B1","W22","history"].includes(view))view="overview";
 for(const b of document.querySelectorAll(".navbtn"))b.setAttribute("aria-current",b.dataset.view===view?"page":"false");
 target.innerHTML=view==="B0"?b0():view==="B1"?b1():view==="W22"?w22():view==="history"?history():overview();
 if(view==="B0")detailB0(0);
 document.title="MTS NL — "+({overview:"Обзор",B0:"Предсказания",B1:"Структура",W22:"60 книг",history:"История"}[view]);
 if(location.hash!=="#"+view)window.history.replaceState(null,"","#"+view);
}
document.addEventListener("click",e=>{
 const button=e.target.closest("button");
 if(!button)return;
 if(button.dataset.view)navigate(button.dataset.view);
 if(button.dataset.runfilter){
  const filter=button.dataset.runfilter,tbody=document.getElementById("runhistory-rows");
  if(tbody)tbody.innerHTML=ledgerRows(filter);
  for(const b of document.querySelectorAll("[data-runfilter]"))
   b.setAttribute("aria-pressed",String(b.dataset.runfilter===filter));
 }
 if(button.dataset.case!==undefined)detailB0(Number(button.dataset.case));
});
document.addEventListener("input",e=>{
 if(e.target.id!=="case-filter")return;
 const needle=e.target.value.toLocaleLowerCase("ru");
 for(const el of document.querySelectorAll(".sample")){
  const c=experiments.B0.contrasts[Number(el.dataset.case)];
  el.hidden=!([c.reference,c.alternative,c.kind,c.id].join(" ").toLocaleLowerCase("ru").includes(needle));
 }
});
window.addEventListener("hashchange",()=>navigate(location.hash.slice(1)));
navigate(location.hash.slice(1));
})();
</script>
</body>
</html>
